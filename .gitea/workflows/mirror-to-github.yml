name: Mirror to GitHub

# Auto-mirror the public file subset to github.com/satwareAG/satag-research-plugin.
# Runs privacy scan + tests BEFORE pushing. If either fails, no GitHub push.
#
# Blueprint: ~/internal/typingmind/specs/002-plugin-release-blueprint/spec.md
# Constitution Art. XII (Public Privacy Boundary, NON-NEGOTIABLE) + Art. XIII (Plugin Test-First).
#
# Required secret (set once in Gitea repo settings):
#   GH_MIRROR_TOKEN - GitHub PAT with `contents: write` on the target repo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Privacy scan (Art. XII gate)
        run: |
          set -euo pipefail
          # Banned patterns - synced with ~/internal/typingmind/scripts/privacy-scan-plugin.sh
          BANNED='git\.satware\.ai|gitlab\.satware\.com|mcp-vps|srv-[a-z0-9-]+|/root/|[Pp][Mm]2|@typingmind/mcp|[a-zA-Z0-9._%+-]+@satware\.(com|ai)\b'
          VIOLATIONS=0
          for f in implementation.js plugin.json README.md LICENSE .gitignore; do
            [ -f "$f" ] || continue
            matches=$(grep -nE "$BANNED" "$f" 2>/dev/null || true)
            if [ -n "$matches" ]; then
              echo "PRIVACY VIOLATION in $f:" >&2
              echo "$matches" >&2
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "" >&2
            echo "Privacy scan FAILED: $VIOLATIONS file(s) with violations." >&2
            echo "No GitHub push will occur." >&2
            exit 1
          fi
          echo "Privacy scan: PASS (0 violations)"

      - name: Run tests (plugin test-first gate)
        run: |
          if [ -f tests/run-tests.js ]; then
            node tests/run-tests.js
          else
            echo "No test suite found - skipping (warning)"
          fi

      - name: Push allow-listed files to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          REPO_NAME="${{ github.event.repository.name }}"
          GH_URL="https://satwareAG-ironMike:${GH_TOKEN}@github.com/satwareAG/${REPO_NAME}.git"
          # Clone the existing GitHub mirror (empty on first run is fine)
          git clone "$GH_URL" /tmp/gh || {
            # First-run: repo exists but is empty; clone returns non-zero. Retry with init.
            mkdir -p /tmp/gh
            cd /tmp/gh
            git init -b main
            git remote add origin "$GH_URL"
          }
          cd /tmp/gh
          git config user.email "ci@satware.ai"
          git config user.name "satware CI"
          # Copy ONLY allow-listed files (Art. IX)
          for f in implementation.js plugin.json README.md LICENSE .gitignore; do
            [ -f "$GITHUB_WORKSPACE/$f" ] && cp "$GITHUB_WORKSPACE/$f" ./
          done
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to mirror. Skipping push."
            exit 0
          fi
          git commit -m "Auto-mirror from Gitea $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin main || git push -u origin main
          echo "GitHub mirror updated."
